name: Manifest Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  manifest-check:
    name: Check generated manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify manifest files are current
        run: python3 scripts/generate_manifest.py --check
